<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Ultimate Finance Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Neon Theme System Variables */
        :root {
            --bg-color: #0d0f14;
            --panel-bg: #161b22;
            --neon-blue: #00f0ff;
            --neon-green: #39ff14;
            --neon-pink: #ff007f;
            --neon-purple: #bd00ff;
            --text-color: #e2e8f0;
            --text-muted: #8b949e;
            --card-border: rgba(255, 255, 255, 0.05);
            --card-bg: rgba(255, 255, 255, 0.02);
            --input-bg: #21262d;
            --input-border: #30363d;
            --list-item-bg: #1f242c;
            --glow-intensity: 0.5;
        }

        [data-theme="light"] {
            --bg-color: #f0f4f8;
            --panel-bg: #ffffff;
            --neon-blue: #0088ff;
            --neon-green: #00cc00;
            --neon-pink: #ff0066;
            --neon-purple: #9900ff;
            --text-color: #1a1f26;
            --text-muted: #626d7a;
            --card-border: rgba(0, 136, 255, 0.1);
            --card-bg: rgba(0, 136, 255, 0.02);
            --input-bg: #f8fafc;
            --input-border: #cbd5e1;
            --list-item-bg: #f1f5f9;
            --glow-intensity: 0.35;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: var(--panel-bg);
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 0 20px rgba(0, 240, 255, var(--glow-intensity)), inset 0 0 10px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.2);
            position: relative;
        }

        /* --- 📱 MOBILE OPTIMIZED NEON HEADER BAR --- */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            padding-bottom: 12px;
            border-bottom: 1px dashed rgba(0, 240, 255, 0.15);
        }

        h2 {
            color: var(--neon-blue);
            text-shadow: 0 0 8px rgba(0, 240, 255, var(--glow-intensity));
            font-size: 1.35rem;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Neon Round Button Style for Settings and Back Hooks */
        .neon-circle-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: var(--neon-blue);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.15);
            transition: all 0.25s ease;
        }
        .neon-circle-btn:hover, .neon-circle-btn:active {
            background: rgba(0, 240, 255, 0.1);
            border-color: var(--neon-blue);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
            text-shadow: 0 0 6px rgba(0, 240, 255, 0.8);
        }

        .setting-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--input-border);
            padding-bottom: 12px;
            margin-bottom: 25px;
        }

        .back-circle-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 0, 127, 0.3);
            color: var(--neon-pink);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            box-shadow: 0 0 8px rgba(255, 0, 127, 0.15);
            transition: all 0.25s ease;
        }
        .back-circle-btn:hover, .back-circle-btn:active {
            background: rgba(255, 0, 127, 0.1);
            border-color: var(--neon-pink);
            box-shadow: 0 0 12px rgba(255, 0, 127, 0.5);
            text-shadow: 0 0 6px rgba(255, 0, 127, 0.8);
        }

        .navigation-tabs {
            display: flex;
            border-bottom: 2px solid var(--input-border);
            margin-bottom: 25px;
            gap: 5px;
        }

        .nav-tab {
            flex: 1;
            padding: 12px 5px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            border-bottom: 3px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .nav-tab:hover { color: var(--text-color); }
        .nav-tab.active {
            color: var(--neon-blue);
            border-bottom-color: var(--neon-blue);
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
        }

        .view-section {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .view-section.active { display: block; }

        .dashboard-month-title {
            text-align: center;
            font-size: 1.05rem;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed rgba(0, 240, 255, 0.3);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .db-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--card-border);
        }

        .db-card.full-card { grid-column: span 2; }
        .db-card p {
            font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px;
            text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; justify-content: center; gap: 6px;
        }

        .db-amount { font-size: 1.3rem; font-weight: bold; }
        .card-income { border-color: rgba(57, 255, 20, 0.3); box-shadow: inset 0 0 10px rgba(57, 255, 20, 0.05); }
        .card-income .db-amount { color: var(--neon-green); text-shadow: 0 0 8px rgba(57, 255, 20, var(--glow-intensity)); }
        .card-income p i { color: var(--neon-green); }

        .card-expense { border-color: rgba(255, 0, 127, 0.3); box-shadow: inset 0 0 10px rgba(255, 0, 127, 0.05); }
        .card-expense .db-amount { color: var(--neon-pink); text-shadow: 0 0 8px rgba(255, 0, 127, var(--glow-intensity)); }
        .card-expense p i { color: var(--neon-pink); }

        .card-balance { border-color: rgba(0, 240, 255, 0.4); box-shadow: 0 0 10px rgba(0, 240, 255, 0.05); }
        .card-balance .db-amount { font-size: 1.7rem; color: var(--neon-blue); text-shadow: 0 0 10px rgba(0, 240, 255, var(--glow-intensity)); }
        .card-balance p i { color: var(--neon-blue); }

        .type-selector { display: flex; gap: 15px; margin-bottom: 20px; }
        .type-btn {
            flex: 1; padding: 12px; border: 2px solid transparent; border-radius: 8px; cursor: pointer;
            font-weight: bold; font-size: 0.95rem; background: var(--input-bg); color: var(--text-muted);
            border-color: var(--input-border); display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        .type-btn#btn-income.active {
            background: rgba(57, 255, 20, 0.1); color: var(--neon-green); border-color: var(--neon-green);
            box-shadow: 0 0 10px rgba(57, 255, 20, var(--glow-intensity));
        }
        .type-btn#btn-expense.active {
            background: rgba(255, 0, 127, 0.1); color: var(--neon-pink); border-color: var(--neon-pink);
            box-shadow: 0 0 10px rgba(255, 0, 127, var(--glow-intensity));
        }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--text-muted); }
        .input-group input, .input-group select {
            width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid var(--input-border);
            border-radius: 8px; color: var(--text-color); font-size: 0.95rem; outline: none;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: var(--neon-blue); box-shadow: 0 0 8px rgba(0, 240, 255, var(--glow-intensity));
        }

        .submit-btn {
            width: 100%; padding: 14px; background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink));
            border: none; border-radius: 8px; color: #fff; font-weight: bold; font-size: 1rem;
            cursor: pointer; margin-top: 5px; box-shadow: 0 0 12px rgba(0, 240, 255, var(--glow-intensity));
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .submit-btn:hover { opacity: 0.9; box-shadow: 0 0 18px rgba(255, 0, 127, 0.6); }

        .filter-section {
            background: var(--card-bg); padding: 15px; border-radius: 12px;
            border: 1px solid rgba(189, 0, 255, 0.3); box-shadow: 0 0 8px rgba(189, 0, 255, 0.05); margin-bottom: 25px;
        }
        .filter-title {
            font-size: 0.9rem; color: var(--neon-purple); text-shadow: 0 0 5px rgba(189, 0, 255, var(--glow-intensity));
            margin-bottom: 12px; font-weight: bold; display: flex; align-items: center; gap: 8px;
        }

        .history-section h3 {
            font-size: 1.1rem; margin-bottom: 15px; color: var(--neon-blue);
            border-bottom: 1px solid var(--input-border); padding-bottom: 8px; display: flex; align-items: center; gap: 8px;
        }

        .list-container { max-height: 420px; overflow-y: auto; padding-right: 5px; }
        .list-container::-webkit-scrollbar { width: 5px; }
        .list-container::-webkit-scrollbar-thumb { background: var(--input-border); border-radius: 4px; }

        /* --- 📋 HISTORY CARD DESIGN --- */
        .neon-card-item {
            background: var(--list-item-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            position: relative;
            border-left: 5px solid transparent;
        }
        .neon-card-item.income { border-left-color: var(--neon-green); }
        .neon-card-item.expense { border-left-color: var(--neon-pink); }

        .card-row-top {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed var(--input-border);
            padding-bottom: 6px;
        }
        .card-date-lbl {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .card-icon-controls {
            display: flex;
            gap: 8px;
        }
        .neon-outline-icon-btn {
            background: none;
            border: 1px solid transparent;
            padding: 5px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.82rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .neon-outline-icon-btn.btn-edit-ic {
            color: var(--neon-blue);
            border-color: rgba(0, 240, 255, 0.4);
            box-shadow: 0 0 6px rgba(0, 240, 255, 0.1);
        }
        .neon-outline-icon-btn.btn-edit-ic:hover {
            background: rgba(0, 240, 255, 0.1);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }
        .neon-outline-icon-btn.btn-delete-ic {
            color: var(--neon-pink);
            border-color: rgba(255, 0, 127, 0.4);
            box-shadow: 0 0 6px rgba(255, 0, 127, 0.1);
        }
        .neon-outline-icon-btn.btn-delete-ic:hover {
            background: rgba(255, 0, 127, 0.1);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.4);
        }

        .card-row-mid {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .card-row-mid .cat-badge {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--neon-blue);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .card-row-mid .desc-text {
            font-size: 0.88rem;
            color: var(--text-color);
            opacity: 0.85;
            padding-left: 2px;
        }
        .card-row-bottom {
            margin-top: 2px;
        }
        .card-row-bottom .amt-display {
            font-weight: bold;
            font-size: 1.1rem;
        }
        .income .amt-display { color: var(--neon-green); text-shadow: 0 0 5px rgba(57, 255, 20, 0.2); }
        .expense .amt-display { color: var(--neon-pink); text-shadow: 0 0 5px rgba(255, 0, 127, 0.2); }

        /* --- 📊 NEON OUTLINE BOX SUMMARY DESIGN --- */
        .summary-card-item {
            background: var(--list-item-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }
        .sum-row-top {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--text-color);
            border-bottom: 1px solid var(--input-border);
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sum-row-mid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .neon-outline-box {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid transparent;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
        }
        .neon-outline-box.box-inc {
            color: var(--neon-green);
            border-color: rgba(57, 255, 20, 0.3);
            box-shadow: 0 0 8px rgba(57, 255, 20, 0.1), inset 0 0 6px rgba(57, 255, 20, 0.03);
        }
        .neon-outline-box.box-exp {
            color: var(--neon-pink);
            border-color: rgba(255, 0, 127, 0.3);
            box-shadow: 0 0 8px rgba(255, 0, 127, 0.1), inset 0 0 6px rgba(255, 0, 127, 0.03);
        }
        
        .sum-row-bottom {
            border-top: 1px dashed var(--input-border);
            padding-top: 10px;
        }
        .neon-outline-box.box-net {
            width: 100%;
            font-size: 1.2rem;
            font-weight: 900;
        }

        /* --- ⚙️ SETTING TOGGLES DESIGN --- */
        .setting-row-item {
            background: var(--list-item-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .setting-label-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .setting-title-lbl {
            font-size: 1rem;
            font-weight: bold;
            color: var(--text-color);
        }
        .setting-desc-lbl {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Neon Switch Toggle System */
        .neon-switch {
            position: relative;
            display: inline-block;
            width: 54px;
            height: 28px;
        }
        .neon-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .neon-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            transition: .3s;
            border-radius: 34px;
        }
        .neon-slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: var(--text-muted);
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .neon-slider {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }
        input:checked + .neon-slider:before {
            transform: translateX(26px);
            background-color: var(--neon-blue);
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
        }

        input#theme-toggle:checked + .neon-slider {
            border-color: var(--neon-purple);
            box-shadow: 0 0 10px rgba(189, 0, 255, 0.4);
        }
        input#theme-toggle:checked + .neon-slider:before {
            background-color: var(--neon-purple);
            box-shadow: 0 0 8px rgba(189, 0, 255, 0.8);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- 📱 TOP HEADER ROW WITH OPTIMIZED ROUND NEON BUTTON -->
        <div id="main-header-block" class="header-section">
            <h2 id="main-title"><i class="fa-solid fa-wallet"></i> FINANCE TRACKER</h2>
            <button type="button" class="neon-circle-btn" onclick="switchView('setting')">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>

        <!-- NAVIGATION TABS BLOCK -->
        <div class="navigation-tabs" id="main-nav-tabs">
            <button class="nav-tab active" id="tab-form" onclick="switchView('form')"><i class="fa-solid fa-pen-to-square"></i> စာရင်းသွင်း</button>
            <button class="nav-tab" id="tab-history" onclick="switchView('history')"><i class="fa-solid fa-chart-simple"></i> မှတ်တမ်း</button>
            <button class="nav-tab" id="tab-summary" onclick="switchView('summary')"><i class="fa-solid fa-table-list"></i> ပေါင်းချုပ်</button>
        </div>

        <!-- 1️⃣ FORM VIEW SECTION -->
        <div id="section-form" class="view-section active">
            <div class="dashboard-month-title" id="dashboard-month-header"><i class="fa-solid fa-calendar-days"></i> -</div>
            <div class="dashboard-grid">
                <div class="db-card card-income">
                    <p id="label-monthly-income"><i class="fa-solid fa-arrow-trend-up"></i> ဝင်ငွေ</p>
                    <div class="db-amount" id="total-income"></div>
                </div>
                <div class="db-card card-expense">
                    <p id="label-monthly-expense"><i class="fa-solid fa-arrow-trend-down"></i> ထွက်ငွေ</p>
                    <div class="db-amount" id="total-expense"></div>
                </div>
                <div class="db-card card-balance full-card">
                    <p id="label-monthly-balance"><i class="fa-solid fa-scale-balanced"></i> လက်ကျန်ငွေ</p>
                    <div class="db-amount" id="net-balance"></div>
                </div>
            </div>

            <div class="type-selector">
                <button type="button" class="type-btn active" id="btn-income" onclick="setTransactionType('income')"><i class="fa-solid fa-circle-plus"></i> ဝင်ငွေ (+)</button>
                <button type="button" class="type-btn" id="btn-expense" onclick="setTransactionType('expense')"><i class="fa-solid fa-circle-minus"></i> ထွက်ငွေ (-)</button>
            </div>

            <form id="transaction-form" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="edit-id">
                <div class="input-group">
                    <label for="category" id="lbl-select-cat">အမျိုးအစား ရွေးချယ်ရန်</label>
                    <select id="category" required></select>
                </div>
                <div class="input-group">
                    <label for="amount" id="lbl-amount">ပမာဏ (ကျပ်)</label>
                    <input type="number" id="amount" placeholder="0" min="1" required>
                </div>
                <div class="input-group">
                    <label for="description" id="lbl-desc">အကြောင်းအရာ/မှတ်စု</label>
                    <input type="text" id="description" placeholder="ဥပမာ - ဘောနပ်စ်ရလို့၊ ဆိုင်ကယ်ဆီဖြည့်">
                </div>
                <div class="input-group">
                    <label for="date" id="lbl-date">ရက်စွဲ</label>
                    <input type="date" id="date" required onchange="handleFormDateChange()">
                </div>
                <button type="submit" class="submit-btn" id="submit-btn"><i class="fa-solid fa-floppy-disk"></i> စာရင်းသွင်းရန်</button>
            </form>
        </div>

        <!-- 2️⃣ HISTORY VIEW SECTION -->
        <div id="section-history" class="view-section">
            <div class="filter-section">
                <div class="filter-title" id="lbl-filter-title"><i class="fa-solid fa-magnifying-glass"></i> စာရင်းများကို စစ်ထုတ်ကြည့်ရှုရန် (Filters)</div>
                <div class="input-group">
                    <label for="filter-type" id="lbl-filter-type-lbl">ဝင်ငွေ/ထွက်ငွေအလိုက်</label>
                    <select id="filter-type" onchange="updateUI()"></select>
                </div>
                <div class="input-group" style="margin-bottom: 0;">
                    <label for="filter-date" id="lbl-filter-date-lbl">ရက်စွဲအလိုက် (လအလိုက်)</label>
                    <input type="month" id="filter-date" onchange="updateUI()">
                </div>
            </div>

            <div class="history-section" style="padding: 2px;">
                <h3 id="lbl-list-title"><i class="fa-solid fa-list-ul"></i> မှတ်တမ်းများ</h3>

        <!-- 3️⃣ SUMMARY VIEW SECTION -->
        <div id="section-summary" class="view-section">
            <div class="history-section">
                <h3 id="lbl-summary-title"><i class="fa-solid fa-table-list"></i> လအလိုက် စာရင်းပေါင်းချုပ် (Monthly Summary)</h3>

        <!-- 4️⃣ SETTING VIEW SECTION (WITH MATCHING ROUND BACK HOOK) -->
        <div id="section-setting" class="view-section">
            <div class="setting-header-row">
                <h3 id="lbl-setting-heading" style="color: var(--neon-blue); font-size: 1.15rem; font-weight: bold; display: flex; align-items: center; gap: 8px;"><i class="fa-solid fa-sliders"></i> SETTINGS</h3>

            <div class="setting-row-item">
                <div class="setting-label-box">
                    <span class="setting-title-lbl" id="lbl-setting-lang-title">Language</span>
                    <span class="setting-desc-lbl" id="lbl-setting-lang-desc">English / မြန်မာဘာသာ</span>

                    <input type="checkbox" id="lang-toggle" onchange="handleLanguageToggle(this)">

            <div class="setting-row-item">
                <div class="setting-label-box">
                    <span class="setting-title-lbl" id="lbl-setting-theme-title">Theme Style</span>

                    <span class="neon-slider"></span>

    </div>

    <script>
        let transactions = JSON.parse(localStorage.getItem('neon_transactions')) || [];
        let currentType = 'income';
        let currentLang = localStorage.getItem('neon_lang') || 'my'; 
        let currentTheme = localStorage.getItem('neon_theme') || 'dark';
        let currentActiveView = 'form';

        function initThemeAndSwitches() {
            document.documentElement.setAttribute('data-theme', currentTheme);
            document.getElementById('theme-toggle').checked = (currentTheme === 'light');
            document.getElementById('lang-toggle').checked = (currentLang === 'en');
        }

        function handleThemeToggle(checkbox) {
            currentTheme = checkbox.checked ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            localStorage.setItem('neon_theme', currentTheme);
        }

        function handleLanguageToggle(checkbox) {
            currentLang = checkbox.checked ? 'en' : 'my';
            localStorage.setItem('neon_lang', currentLang);
            translateStaticUI();
            loadCategories();
            updateUI();
        }

        const i18n = {
            my: {
                mainTitle: '<i class="fa-solid fa-wallet"></i> FINANCE TRACKER',

                tabSummary: '<i class="fa-solid fa-table-list"></i> ပေါင်းချုပ်',

                btnExpense: '<i class="fa-solid fa-circle-minus"></i> ထွက်ငွေ (-)',
                lblSelectCat: "အမျိုးအစား ရွေးချယ်ရန်",
                lblAmount: "ပမာဏ (ကျပ်)",
                lblDesc: "အကြောင်းအရာ/မှတ်စု",
                placeholderDesc: "ဥပမာ - ဘောနပ်စ်ရလို့၊ ဆိုင်ကယ်ဆီဖြည့်",
                lblDate: "ရက်စွဲ",
                btnSubmit: '<i class="fa-solid fa-floppy-disk"></i> စာရင်းသွင်းရန်',
                btnSaveEdit: '<i class="fa-solid fa-pen-to-square"></i> ပြင်ဆင်ချက်သိမ်းရန်',
                lblFilterTitle: '<i class="fa-solid fa-magnifying-glass"></i> စာရင်းများကို စစ်ထုတ်ကြည့်ရှုရန် (Filters)',
                lblFilterTypeLbl: "ဝင်ငွေ/ထွက်ငွေအလိုက်",
                lblFilterDateLbl: "ရက်စွဲအလိုက် (လအလိုက်)",
                lblListTitle: '<i class="fa-solid fa-list-ul"></i> မှတ်တမ်းများ',
                lblSummaryTitle: '<i class="fa-solid fa-table-list"></i> လအလိုက် စာရင်းပေါင်းချုပ် (Monthly Summary)',
                optAll: "စာရင်းအားလုံးပြရန်", optIncOnly: "ဝင်ငွေများသာ ပြရန်", optExpOnly: "ထွက်ငွေများသာ ပြရန်",
                noRecords: "ရှာဖွေမှုမှတ်တမ်းမရှိပါ။", noSummaryRecords: "ပေါင်းချုပ်ကြည့်ရန် စာရင်းမှတ်တမ်းမရှိသေးပါ။",
                currency: "ကျပ်", confirmDelete: "ဤစာရင်းကို ဖျက်ရန် သေချက်ပါသလား?",
                labelIncome: '<i class="fa-solid fa-arrow-trend-up"></i> ဝင်ငွေ', labelExpense: '<i class="fa-solid fa-arrow-trend-down"></i> ထွက်ငွေ', labelBalance: '<i class="fa-solid fa-scale-balanced"></i> လက်ကျန်ငွေ',
                lblSettingHeading: '<i class="fa-solid fa-sliders"></i> ဆက်တင်များ',
                lblSettingLangTitle: 'ဘာသာစကား (Language)',
                lblSettingLangDesc: 'မြန်မာဘာသာ / English ပြောင်းရန်',
                lblSettingThemeTitle: 'အလင်း/အမှောင်စနစ် (Theme)',
                lblSettingThemeDesc: 'Dark စနစ် / Light စနစ် ပြောင်းရန်',
                months: ["ဇန်နဝါရီ", "ဖေဖော်ဝါရီ", "မတ်", "ဧပြီ", "မေ", "ဇွန်", "ဇူလိုင်", "သြဂုတ်", "စက်တင်ဘာ", "အောက်တိုဘာ", "နိုဝင်ဘာ", "ဒီဇင်ဘာ"],
                categories: {
                    income: ['လစာ / ဝင်ငွေ', 'စီးပွားရေး / အရောင်း', 'ရင်းနှီးမြှုပ်နှံမှု', 'ဆုကြေး / ဘောနပ်စ်', 'အထွေထွေဝင်ငွေ'],
                    expense: ['အစားအသောက်', 'အိမ်လခ / မီတာခ', 'သယ်ယူပို့ဆောင်ရေး', 'ဖျော်ဖြေရေး / လည်ပတ်', 'ကျန်းမာရေး / ဆေးဝါး', 'အဝတ်အထည်', 'အထွေထွေအသုံးစရိတ်']
                }
            },
            en: {
                mainTitle: '<i class="fa-solid fa-wallet"></i> FINANCE TRACKER',
                tabForm: '<i class="fa-solid fa-pen-to-square"></i> Add',
                tabHistory: '<i class="fa-solid fa-chart-simple"></i> History',
                tabSummary: '<i class="fa-solid fa-table-list"></i> Summary',
                btnIncome: '<i class="fa-solid fa-circle-plus"></i> Income (+)',
                btnExpense: '<i class="fa-solid fa-circle-minus"></i> Expense (-)',
                lblSelectCat: "Select Category",
                lblAmount: "Amount (MMK)",
                lblDesc: "Description / Notes",
                placeholderDesc: "e.g., Bonus, Fuel refill",
                lblDate: "Date",
                btnSubmit: '<i class="fa-solid fa-floppy-disk"></i> Save Record',
                btnSaveEdit: '<i class="fa-solid fa-pen-to-square"></i> Update Changes',
                lblFilterTitle: '<i class="fa-solid fa-magnifying-glass"></i> Filter Controls',
                lblFilterTypeLbl: "Filter by Type",
                lblFilterDateLbl: "Filter by Month",
                lblListTitle: '<i class="fa-solid fa-list-ul"></i> Logs List',
                lblSummaryTitle: '<i class="fa-solid fa-table-list"></i> Monthly Summary',
                optAll: "Show All Records", optIncOnly: "Income Only", optExpOnly: "Expense Only",
                noRecords: "No transactions found matching filters.", noSummaryRecords: "No data available to compile summary.",
                currency: "MMK", confirmDelete: "Are you sure you want to delete this item?",
                labelIncome: '<i class="fa-solid fa-arrow-trend-up"></i> Income', labelExpense: '<i class="fa-solid fa-arrow-trend-down"></i> Expense', labelBalance: '<i class="fa-solid fa-scale-balanced"></i> Net Balance',
                lblSettingHeading: '<i class="fa-solid fa-sliders"></i> Settings',
                lblSettingLangTitle: 'Language',
                lblSettingLangDesc: 'Switch English / Myanmar Language',
                lblSettingThemeTitle: 'Theme Style',
                lblSettingThemeDesc: 'Toggle Dark / Light Visual Mode',
                months: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"],
                categories: {
                    income: ['Salary / Allowance', 'Business / Sales', 'Investment Return', 'Bonus / Rewards', 'Other Income'],
                    expense: ['Food & Drinks', 'Rent / Utilities', 'Transportation', 'Entertainment', 'Medical & Healthcare', 'Clothing', 'General Expenses']
                }
            }
        };

        function formatNumber(num) {
            if (num === null || num === undefined) return currentLang === 'my' ? '၀' : '0';
            let englishFormatted = parseFloat(num).toLocaleString('en-US');
            if (currentLang === 'en') return englishFormatted;
            const myanmarDigits = ['၀', '၁', '၂', '၃', '၄', '၅', '၆', '၇', '၈', '၉'];
            let result = englishFormatted.replace(/[0-9]/g, function(w) { return myanmarDigits[+w]; });
            return englishFormatted.startsWith('-') ? `-${result}` : result;
        }

        function formatDateString(dateStr) {
            if(!dateStr) return "";
            if(currentLang === 'en') return dateStr;
            const dParts = dateStr.split('-');
            return `${formatNumber(dParts[0])}-${formatNumber(dParts[1])}-${formatNumber(dParts[2])}`;
        }

        function translateStaticUI() {
            const strings = i18n[currentLang];
            document.getElementById('main-title').innerHTML = strings.mainTitle;
            document.getElementById('tab-form').innerHTML = strings.tabForm;
            document.getElementById('tab-history').innerHTML = strings.tabHistory;
            document.getElementById('tab-summary').innerHTML = strings.tabSummary;
            document.getElementById('btn-income').innerHTML = strings.btnIncome;
            document.getElementById('btn-expense').innerHTML = strings.btnExpense;
            document.getElementById('lbl-select-cat').innerText = strings.lblSelectCat;
            document.getElementById('lbl-amount').innerText = strings.lblAmount;
            document.getElementById('lbl-desc').innerText = strings.lblDesc;
            document.getElementById('description').placeholder = strings.placeholderDesc;
            document.getElementById('lbl-date').innerText = strings.lblDate;
            
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.innerHTML = document.getElementById('edit-id').value ? strings.btnSaveEdit : strings.btnSubmit;

            document.getElementById('lbl-filter-title').innerHTML = strings.lblFilterTitle;
            document.getElementById('lbl-filter-type-lbl').innerText = strings.lblFilterTypeLbl;
            document.getElementById('lbl-filter-date-lbl').innerText = strings.lblFilterDateLbl;
            document.getElementById('lbl-list-title').innerHTML = strings.lblListTitle;
            document.getElementById('lbl-summary-title').innerHTML = strings.lblSummaryTitle;

            document.getElementById('lbl-setting-heading').innerHTML = strings.lblSettingHeading;
            document.getElementById('lbl-setting-lang-title').innerText = strings.lblSettingLangTitle;
            document.getElementById('lbl-setting-lang-desc').innerText = strings.lblSettingLangDesc;
            document.getElementById('lbl-setting-theme-title').innerText = strings.lblSettingThemeTitle;
            document.getElementById('lbl-setting-theme-desc').innerText = strings.lblSettingThemeDesc;

            const filterTypeSelect = document.getElementById('filter-type');
            const savedValue = filterTypeSelect.value || "all";
            filterTypeSelect.innerHTML = `
                <option value="all">${strings.optAll}</option>
                <option value="income">${strings.optIncOnly}</option>
                <option value="expense">${strings.optExpOnly}</option>
            `;
            filterTypeSelect.value = savedValue;
        }

        function resetDateToToday() {
            const today = new Date();
            const offset = today.getTimezoneOffset();
            const localToday = new Date(today.getTime() - (offset * 60 * 1000));
            document.getElementById('date').value = localToday.toISOString().split('T')[0];
        }

        resetDateToToday();
        
        function switchView(view) {
            currentActiveView = view;
            
            document.getElementById('main-header-block').style.display = (view === 'setting') ? 'none' : 'flex';
            document.getElementById('main-nav-tabs').style.display = (view === 'setting') ? 'none' : 'flex';

            document.getElementById('tab-form').classList.toggle('active', view === 'form');
            document.getElementById('tab-history').classList.toggle('active', view === 'history');
            document.getElementById('tab-summary').classList.toggle('active', view === 'summary');
            
            document.getElementById('section-form').classList.toggle('active', view === 'form');
            document.getElementById('section-history').classList.toggle('active', view === 'history');
            document.getElementById('section-summary').classList.toggle('active', view === 'summary');
            document.getElementById('section-setting').classList.toggle('active', view === 'setting');
            
            if (view === 'setting') {
                if (window.history.state !== 'setting-view') {
                    window.history.pushState('setting-view', '');
                }
            }
            
            updateUI();
        }

        function goBackToMain() {
            switchView('form');
        }

        window.addEventListener('popstate', function(event) {
            if (currentActiveView === 'setting') {
                goBackToMain();
            } else {
                window.history.back();
            }
        });

        window.history.replaceState('main-view', '');

        function loadCategories() {
            const strings = i18n[currentLang];
            const categorySelect = document.getElementById('category');
            const previousSelectedValue = categorySelect.value;
            categorySelect.innerHTML = '';
            strings.categories[currentType].forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.innerText = cat;
                categorySelect.appendChild(opt);
            });
            if (previousSelectedValue && strings.categories[currentType].includes(previousSelectedValue)) {
                categorySelect.value = previousSelectedValue;
            }
        }

        function setTransactionType(type) {
            currentType = type;
            document.getElementById('btn-income').classList.toggle('active', type === 'income');
            document.getElementById('btn-expense').classList.toggle('active', type === 'expense');
            loadCategories();
        }

        function handleFormDateChange() { updateUI(); }

        function updateUI() {
            if(currentActiveView === 'setting') return;

            const strings = i18n[currentLang];
            const listContainer = document.getElementById('transaction-list');
            const summaryCardList = document.getElementById('summary-card-list');
            
            const totalIncomeEl = document.getElementById('total-income');
            const totalExpenseEl = document.getElementById('total-expense');
            const netBalanceEl = document.getElementById('net-balance');
            
            const filterType = document.getElementById('filter-type').value || "all";
            const filterDateValue = document.getElementById('filter-date').value;
            const formDateInputValue = document.getElementById('date').value; 
            const currentSelectedMonthStr = formDateInputValue ? formDateInputValue.substring(0, 7) : ""; 

            if(listContainer) listContainer.innerHTML = '';
            if(summaryCardList) summaryCardList.innerHTML = '';
            
            let monthlyIncome = 0; let monthlyExpense = 0;
            transactions.sort((a, b) => new Date(b.date) - new Date(a.date));

            transactions.forEach(t => {
                if (currentSelectedMonthStr && t.date.startsWith(currentSelectedMonthStr)) {
                    if (t.type === 'income') monthlyIncome += parseFloat(t.amount);
                    else monthlyExpense += parseFloat(t.amount);
                }
            });

            let displayMonthLabel = "-";
            if (currentSelectedMonthStr) {
                const parts = currentSelectedMonthStr.split('-');
                const mIdx = parseInt(parts[1], 10) - 1;
                if(mIdx >= 0 && mIdx < 12) {
                    const formattedYear = currentLang === 'my' ? formatNumber(parts[0]) : parts[0];
                    displayMonthLabel = currentLang === 'my' ? `<i class="fa-solid fa-calendar-days"></i> ${strings.months[mIdx]} (${formattedYear})` : `<i class="fa-solid fa-calendar-days"></i> ${strings.months[mIdx]} ${formattedYear}`;
                }
            }
            
            if(document.getElementById('dashboard-month-header')) document.getElementById('dashboard-month-header').innerHTML = displayMonthLabel;
            if(document.getElementById('label-monthly-income')) document.getElementById('label-monthly-income').innerHTML = strings.labelIncome;
            if(document.getElementById('label-monthly-expense')) document.getElementById('label-monthly-expense').innerHTML = strings.labelExpense;
            if(document.getElementById('label-monthly-balance')) document.getElementById('label-monthly-balance').innerHTML = strings.labelBalance;

            if(totalIncomeEl) totalIncomeEl.innerText = `${formatNumber(monthlyIncome)} ${strings.currency}`;
            if(totalExpenseEl) totalExpenseEl.innerText = `${formatNumber(monthlyExpense)} ${strings.currency}`;
            const monthlyNetBalance = monthlyIncome - monthlyExpense;
            if(netBalanceEl) {
                netBalanceEl.innerText = `${formatNumber(monthlyNetBalance)} ${strings.currency}`;
                netBalanceEl.style.color = monthlyNetBalance >= 0 ? 'var(--neon-blue)' : 'var(--neon-pink)';
            }

            // --- 📋 RENDERING HISTORY CARDS ---
            let filteredItems = transactions;
            if (filterType !== 'all') filteredItems = filteredItems.filter(t => t.type === filterType);
            if (filterDateValue) filteredItems = filteredItems.filter(t => t.date.startsWith(filterDateValue));

            if(listContainer) {
                if (filteredItems.length === 0) {
                    listContainer.innerHTML = `<p style="text-align:center; color:var(--text-muted); font-size:0.9rem; padding: 15px;">${strings.noRecords}</p>`;
                } else {
                    filteredItems.forEach(t => {
                        const card = document.createElement('div');
                        card.className = `neon-card-item ${t.type}`;
                        const formattedAmount = formatNumber(t.amount);
                        const sign = t.type === 'income' ? '+' : '-';
                        const descriptionString = t.description ? t.description : '-';

                        let displayCategory = t.category;
                        const myIndex = i18n.my.categories[t.type].indexOf(t.category);
                        const enIndex = i18n.en.categories[t.type].indexOf(t.category);
                        if (currentLang === 'en' && myIndex !== -1) displayCategory = i18n.en.categories[t.type][myIndex];
                        else if (currentLang === 'my' && enIndex !== -1) displayCategory = i18n.my.categories[t.type][enIndex];

                        let catIcon = "fa-tags";
                        if(t.type === 'income') {
                            if(enIndex === 0 || myIndex === 0) catIcon = "fa-money-check-dollar";
                            else if(enIndex === 1 || myIndex === 1) catIcon = "fa-shop";
                            else if(enIndex === 2 || myIndex === 2) catIcon = "fa-chart-line";
                            else if(enIndex === 3 || myIndex === 3) catIcon = "fa-gift";
                        } else {
                            if(enIndex === 0 || myIndex === 0) catIcon = "fa-utensils";
                            else if(enIndex === 1 || myIndex === 1) catIcon = "fa-house-chimney";
                            else if(enIndex === 2 || myIndex === 2) catIcon = "fa-car";
                            else if(enIndex === 3 || myIndex === 3) catIcon = "fa-gamepad";
                            else if(enIndex === 4 || myIndex === 4) catIcon = "fa-heart-pulse";
                            else if(enIndex === 5 || myIndex === 5) catIcon = "fa-shirt";
                        }

                        card.innerHTML = `
                            <div class="card-row-top">
                                <span class="card-date-lbl"><i class="fa-solid fa-calendar-day"></i> ${formatDateString(t.date)}</span>
                                <div class="card-icon-controls">
                                    <button class="neon-outline-icon-btn btn-edit-ic" onclick="editTransaction('${t.id}')"><i class="fa-solid fa-pen"></i></button>
                                    <button class="neon-outline-icon-btn btn-delete-ic" onclick="deleteTransaction('${t.id}')"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                            <div class="card-row-mid">
                                <div class="cat-badge"><i class="fa-solid ${catIcon}"></i> ${displayCategory}</div>
                                <div class="desc-text"><i class="fa-solid fa-comment-dots" style="font-size:0.75rem; opacity:0.6;"></i> ${descriptionString}</div>
                            </div>
                            <div class="card-row-bottom">
                                <div class="amt-display">${sign} ${formattedAmount} ${strings.currency}</div>
                            </div>
                        `;
                        listContainer.appendChild(card);
                    });
                }
            }

            // --- 📊 RENDERING SUMMARY CARDS ---
            let rollupData = {};
            transactions.forEach(t => {
                if(t.date) {
                    const monthKey = t.date.substring(0, 7);
                    if(!rollupData[monthKey]) rollupData[monthKey] = { income: 0, expense: 0 };
                    if(t.type === 'income') rollupData[monthKey].income += parseFloat(t.amount);
                    else rollupData[monthKey].expense += parseFloat(t.amount);
                }
            });

            const sortedMonths = Object.keys(rollupData).sort((a, b) => new Date(b + "-01") - new Date(a + "-01"));

            if(summaryCardList) {
                if(sortedMonths.length === 0) {
                    summaryCardList.innerHTML = `<p style="text-align:center; color:var(--text-muted); font-size:0.9rem; padding: 20px;">${strings.noSummaryRecords}</p>`;
                } else {
                    sortedMonths.forEach(mKey => {
                        const data = rollupData[mKey];
                        const net = data.income - data.expense;
                        
                        const parts = mKey.split('-');
                        const mIdx = parseInt(parts[1], 10) - 1;
                        let monthDisplayLabel = mKey;
                        if(mIdx >= 0 && mIdx < 12) {
                            const formattedYear = currentLang === 'my' ? formatNumber(parts[0]) : parts[0];
                            monthDisplayLabel = currentLang === 'my' ? `${strings.months[mIdx]} (${formattedYear})` : `${strings.months[mIdx]} ${formattedYear}`;
                        }

                        const sumCard = document.createElement('div');
                        sumCard.className = 'summary-card-item';
                        
                        const netBorderGlow = net >= 0 
                            ? 'border-color: rgba(0, 240, 255, 0.4); color: var(--neon-blue); box-shadow: 0 0 10px rgba(0, 240, 255, 0.15), inset 0 0 6px rgba(0, 240, 255, 0.03); text-shadow: 0 0 5px rgba(0, 240, 255, 0.3);' 
                            : 'border-color: rgba(255, 0, 127, 0.4); color: var(--neon-pink); box-shadow: 0 0 10px rgba(255, 0, 127, 0.15), inset 0 0 6px rgba(255, 0, 127, 0.03); text-shadow: 0 0 5px rgba(255, 0, 127, 0.3);';

                        sumCard.innerHTML = `
                            <div class="sum-row-top">
                                <i class="fa-solid fa-folder-open" style="color:var(--neon-purple);"></i> ${monthDisplayLabel}
                            </div>
                            <div class="sum-row-mid">
                                <div class="neon-outline-box box-inc">+${formatNumber(data.income)}</div>
                                <div class="neon-outline-box box-exp">-${formatNumber(data.expense)}</div>
                            </div>
                            <div class="sum-row-bottom">
                                <div class="neon-outline-box box-net" style="${netBorderGlow}">${formatNumber(net)} ${strings.currency}</div>
                            </div>
                        `;
                        summaryCardList.appendChild(sumCard);
                    });
                }
            }
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const strings = i18n[currentLang];
            const idInput = document.getElementById('edit-id').value;
            let category = document.getElementById('category').value;
            const amount = document.getElementById('amount').value;
            const description = document.getElementById('description').value.trim();
            const date = document.getElementById('date').value;

            if (currentLang === 'my') {
                const myIdx = i18n.my.categories[currentType].indexOf(category);
                if(myIdx !== -1) category = i18n.en.categories[currentType][myIdx];
            }

            if (idInput) {
                transactions = transactions.map(t => t.id === idInput ? { ...t, type: currentType, category, amount, description, date } : t);
                document.getElementById('edit-id').value = '';
                document.getElementById('submit-btn').innerHTML = strings.btnSubmit;
            } else {
                transactions.push({ id: Date.now().toString(), type: currentType, category, amount, description, date });
            }

            localStorage.setItem('neon_transactions', JSON.stringify(transactions));
            updateUI();
            document.getElementById('amount').value = '';
            document.getElementById('description').value = '';
            resetDateToToday();
            switchView('history');
        }

        function editTransaction(id) {
            const strings = i18n[currentLang];
            const target = transactions.find(t => t.id === id);
            if (!target) return;
            switchView('form');
            setTransactionType(target.type);
            document.getElementById('edit-id').value = target.id;
            document.getElementById('amount').value = target.amount;
            document.getElementById('description').value = target.description || '';
            document.getElementById('date').value = target.date;
            let lookupCategory = target.category;
            if (currentLang === 'my') {
                const enIdx = i18n.en.categories[target.type].indexOf(target.category);
                if (enIdx !== -1) lookupCategory = i18n.my.categories[target.type][enIdx];
            }
            document.getElementById('category').value = lookupCategory;
            document.getElementById('submit-btn').innerHTML = strings.btnSaveEdit;
            document.getElementById('amount').focus();
            updateUI();
        }

        function deleteTransaction(id) {
            const strings = i18n[currentLang];
            if (confirm(strings.confirmDelete)) {
                transactions = transactions.filter(t => t.id !== id);
                localStorage.setItem('neon_transactions', JSON.stringify(transactions));
                updateUI();
                if(document.getElementById('edit-id').value === id) {
                    document.getElementById('edit-id').value = '';
                    document.getElementById('submit-btn').innerHTML = strings.btnSubmit;
                    document.getElementById('amount').value = '';
                    document.getElementById('description').value = '';
                    resetDateToToday();
                    updateUI();
                }
            }
        }

        initThemeAndSwitches();
        translateStaticUI();
        loadCategories();
        updateUI();
    </script>
</body>
</html>
